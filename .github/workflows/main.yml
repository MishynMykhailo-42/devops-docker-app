name: CI

on:
  push:
    branches:
      - main

jobs:
  lint:
    name: Test/Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Lint
        run: echo "Linting complete"

  build:
    name: Build/Package
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t my-app:latest .
      - name: Show image
        run: docker images my-app
